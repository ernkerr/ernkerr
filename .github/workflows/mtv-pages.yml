name: Publish MTV simulator (GitHub Pages)

# Publishes the mtv-simulator/ folder to GitHub Pages on every push to this
# branch. The first run also switches Pages on for the repository.

on:
  push:
    branches: [claude/mtv-simulator-website-553njz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: mtv-simulator
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
