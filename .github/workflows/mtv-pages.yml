name: Publish MTV simulator (GitHub Pages)

# Turns on GitHub Pages for this repository with this branch as the source,
# so the site is served at https://ernkerr.github.io/ernkerr/mtv-simulator/.
# Run it once from the Actions tab (or the API); after that every push to the
# source branch is published automatically by GitHub's own Pages build.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Enable Pages from this branch
        run: |
          set -e
          if gh api "repos/$REPO/pages" > current.json 2>/dev/null; then
            echo "Pages is already enabled:"; cat current.json; echo
            SRC=$(jq -r '.source.branch // empty' current.json)
            if [ "$SRC" = "$BRANCH" ]; then
              echo "Source branch already set to $BRANCH — nothing to do."
              exit 0
            fi
            echo "Pages is currently published from '$SRC'. Not changing it automatically."
            echo "Switch it to '$BRANCH' under Settings → Pages if that is what you want."
            exit 1
          fi
          echo "Enabling Pages with source branch $BRANCH"
          gh api -X POST "repos/$REPO/pages" \
            -f build_type=legacy \
            -f "source[branch]=$BRANCH" \
            -f "source[path]=/" > result.json
          cat result.json; echo
          echo "Site URL: $(jq -r .html_url result.json)mtv-simulator/"
