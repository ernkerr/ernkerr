name: Publish MTV simulator

# Creates the ernkerr/mtv-simulator repository (once), mirrors the
# mtv-simulator/ folder there as its main branch, and turns on GitHub Pages
# for it, so the site lives at https://ernkerr.github.io/mtv-simulator/.
#
# Uses the repository's GH_TOKEN secret (the same one the README stats
# workflow uses) because the built-in workflow token is not allowed to
# create repositories or enable Pages.

on:
  push:
    branches: [claude/mtv-simulator-website-553njz]
    paths: [mtv-simulator/**, .github/workflows/mtv-pages.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OWNER: ernkerr
      NAME: mtv-simulator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # so the push below uses GH_TOKEN, not the workflow token

      - name: Create the repository if it does not exist
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_TOKEN secret is not set"; exit 1; fi
          if gh api "repos/$OWNER/$NAME" > /dev/null 2>&1; then
            echo "Repository $OWNER/$NAME already exists."
          else
            gh api -X POST user/repos \
              -f name="$NAME" \
              -f description="📺 A big 90s TV that only gets music channels. Flip around, check the guide, and it learns your taste." \
              -F private=false -F has_wiki=false -F has_projects=false > /dev/null
            echo "Created $OWNER/$NAME."
          fi

      - name: Push the site folder as the main branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=mtv-simulator -b site
          git push "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$NAME.git" site:main

      - name: Enable GitHub Pages from main
        run: |
          set -e
          if gh api "repos/$OWNER/$NAME/pages" > /dev/null 2>&1; then
            echo "Pages already enabled."
          else
            gh api -X POST "repos/$OWNER/$NAME/pages" \
              -f build_type=legacy -f "source[branch]=main" -f "source[path]=/" > /dev/null
            echo "Pages enabled."
          fi
          echo "::notice::Site: https://$OWNER.github.io/$NAME/"
